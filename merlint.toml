# TCP has 9 flag bits.
[[rules]]
files = "examples/net/net.ml"
exclude = ["E350"]

# Generated by Wire_ocaml: a function is as long as the codec makes it.
[[rules]]
files = "examples/generated/stack.ml"
exclude = ["E005"]

# verify/ checks the code the generators write against EverParse: a tool of
# its own, beside lib/, test/ and bench/.
[[rules]]
files = "verify/dune"
exclude = ["E912"]

# Checks the planner's plans against the F* model: a tool beside lib/ and test/.
[[rules]]
files = "proofs/fstar/plans/dune"
exclude = ["E912"]

# The model as F* extracts it, which proofs/fstar/plans runs.
[[rules]]
files = "proofs/fstar/plans/extracted/dune"
exclude = ["E912"]

# Extracted by F* from the model: make -C proofs/fstar check-extract diffs it.
[[rules]]
files = "proofs/fstar/plans/extracted/*.ml"
exclude = ["E001", "E010", "E106", "E110", "E210", "E310", "E332", "E505"]

# The pipeline docs/asn1.md designs: test/asn1 runs tool and run with
# BUILD_EVERPARSE=1; the stubs and the differential harness are not
# implemented. The module loses this exclusion with their tests.
[[rules]]
files = "lib/asn1/wire_asn1.ml"
exclude = ["E605"]
