name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['5.4', '5.3']
        include:
          - os: macos-latest
            ocaml-compiler: '5.4'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @install

      # Seed the property tests from the run id so each run explores a
      # different input set instead of replaying alcobar's constant seed.
      # Alcobar prints the counterexample on failure but not the seed, so a red
      # run is replayed with the one recorded here:
      #   WIRE_FUZZ_SEED=<run id> dune runtest
      # 20000 iterations rather than alcobar's 5000, because 5000 was not
      # enough to find the defects that are there.
      - run: opam exec -- dune runtest
        env:
          WIRE_FUZZ_SEED: ${{ github.run_id }}
          WIRE_FUZZ_REPEAT: 20000

  # OCaml's TSan runtime does not currently build on the macOS/arm64 runner
  # (runtime/weak.c), so keep this race-detection lane on Linux. The core test
  # suite includes a synchronized multi-domain decode of one shared codec.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ThreadSanitizer link dependencies
        run: sudo apt-get update && sudo apt-get install -y libunwind-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 'ocaml-variants.5.4.1+options,ocaml-option-tsan'

      - run: opam install . --deps-only --with-test

      - name: Run core tests under ThreadSanitizer
        run: opam exec -- dune exec test/test.exe
        env:
          TSAN_OPTIONS: 'halt_on_error=1 history_size=7'

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install ocamlformat.0.29.0
      - run: opam exec -- dune fmt
      - run: git diff --exit-code

  merlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'
          dune-version: '3.21'

      - run: opam install . --deps-only --with-test
      - run: opam repository add tangled git+https://tangled.org/gazagnaire.org/opam-overlay.git --rank=-1

      - run: opam install merlint

      # merlint --build runs this itself but reports only the exit code, so
      # run it here first to get the compiler error on its own line.
      - run: opam exec -- dune build @check
      - run: opam exec -- merlint --build

  # Static analysis over the hand-written C. EverParse proves the parsers it
  # generates, but nothing covered the benchmark C written by hand around them,
  # in a project whose shipped deliverable is a C archive. The lane needs no
  # opam switch, so it costs a checkout and an apt install, and it is wired as
  # a normal blocking lane on that basis. cppcheck comes from the runner image,
  # so an image bump can bring a version with new checks; that shows up here as
  # a red lane on an unrelated pull request, and is fixed in the C or in the
  # suppression list, never by dropping the lane.
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y cppcheck

      # make cppcheck skips when the tool is absent, which would leave this
      # lane green having checked nothing. Fail here instead if apt did not
      # deliver it, and record the version the findings came from.
      - run: cppcheck --version

      - run: make cppcheck

  # One AFL job per fuzzer: fuzz/ fuzzes the [wire] library (round-trip and
  # validation) and fuzz/3d/ fuzzes [wire_3d] (the EverParse / 3D projection),
  # mirroring the lib/ layout. The [afl] profile (dune-workspace) instruments
  # native code with AFL coverage, and a dir's [fuzz] alias seeds its corpus and
  # runs afl-fuzz for a fixed wall-clock budget. The job names those two aliases
  # non-recursively, as fuzz/diff/ belongs to fuzz-afl-diff below. The job then
  # fails if afl-fuzz found any crashing input in either fuzzer.
  fuzz-afl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install afl-fuzz
        run: sudo apt-get update && sudo apt-get install -y afl++

      - name: Fuzz (seed corpus then afl-fuzz, via the fuzz aliases)
        run: |
          sudo sh -c 'echo core > /proc/sys/kernel/core_pattern'
          export AFL_SKIP_CPUFREQ=1 AFL_NO_AFFINITY=1
          opam exec -- dune build --profile afl @@fuzz/fuzz @@fuzz/3d/fuzz

      - name: Fail on crashes
        run: |
          fail=0
          for d in fuzz fuzz/3d; do
            out=_build/default/$d/_fuzz
            crashes=$(find "$out" -path '*/crashes/id:*' 2>/dev/null || true)
            if [ -n "$crashes" ]; then
              echo "::error::afl-fuzz found crashing inputs in $d/"
              for f in $crashes; do
                echo "--- replaying $f ---"
                _build/default/$d/fuzz.exe "$f" || true
              done
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then echo "No crashes found."; else exit 1; fi

      # afl's output filenames contain ':' (e.g. id:000000,...), which
      # upload-artifact rejects, so tar the findings first.
      - name: Package findings
        if: failure()
        run: tar czf afl-findings.tar.gz -C _build/default fuzz/_fuzz fuzz/3d/_fuzz || true

      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afl-findings
          path: afl-findings.tar.gz

  # Differential fuzzer (fuzz/diff/, the wire_diff library): AFL feeds bytes to
  # both the OCaml codec and the EverParse-generated C parser and crashes on any
  # divergence. This is a separate job because it needs the EverParse toolchain
  # (to generate and compile the C parsers), which the wire / wire_3d fuzzers do
  # not, so installing it here keeps that job fast and its signal independent.
  fuzz-afl-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install afl-fuzz
        run: sudo apt-get update && sudo apt-get install -y afl++

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"

      - name: Fuzz diff (OCaml codec vs EverParse C)
        run: |
          sudo sh -c 'echo core > /proc/sys/kernel/core_pattern'
          export AFL_SKIP_CPUFREQ=1 AFL_NO_AFFINITY=1
          BUILD_EVERPARSE=1 opam exec -- dune build --profile afl @fuzz/diff/fuzz

      - name: Fail on crashes
        run: |
          out=_build/default/fuzz/diff/_fuzz
          crashes=$(find "$out" -path '*/crashes/id:*' 2>/dev/null || true)
          if [ -n "$crashes" ]; then
            echo "::error::afl-fuzz found a differential divergence"
            for f in $crashes; do
              echo "--- replaying $f ---"
              _build/default/fuzz/diff/fuzz.exe "$f" || true
            done
            exit 1
          fi
          echo "No crashes found."

      - name: Package findings
        if: failure()
        run: tar czf afl-diff-findings.tar.gz -C _build/default/fuzz/diff _fuzz || true

      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: afl-diff-findings
          path: afl-diff-findings.tar.gz

  # Build the pure-OCaml core with wasm_of_ocaml and run test/wasm under
  # node (31-bit ints, boxed-int32 optint path). make test-wasm also fails
  # if wasm_of_ocaml truncates an out-of-range integer literal from wire's
  # code, which is how a 64-bit-only constant first surfaces downstream.
  # Meaningful only on a cold build, which CI always is.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      # wasm_of_ocaml shells out to binaryen (wasm-merge, wasm-opt) and needs
      # version 119 or newer; the Ubuntu package is too old.
      - name: Install binaryen
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$BINARYEN_LINUX_X86_64_URL" \
            "$BINARYEN_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - run: opam install wasm_of_ocaml-compiler

      - name: Run the wasm tests under node
        run: opam exec -- make test-wasm

  # Run the test suite with the EverParse toolchain installed so the 3d.exe
  # projection checks actually execute: test/3d compiles and runs the generated
  # C end to end, and fuzz/3d runs every covered schema through 3d.exe. Without
  # 3d.exe both are skipped, so a shape that builds but does not project to a
  # validator EverParse verifies (a composite-over-composite gap) would slip
  # past the plain build job, which only string-checks the projection.
  #
  # The job also runs the suites gated on BUILD_EVERPARSE=1, which nothing else
  # reaches: fuzz-afl-diff sets the variable but builds only @fuzz/diff/fuzz
  # under --profile afl, and those rules require a non-afl profile.
  everparse-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"

      - name: Run tests with 3d.exe projection checks
        run: opam exec -- dune runtest
        env:
          WIRE_3D_BATCH: 1
          WIRE_FUZZ_SEED: ${{ github.run_id }}
          WIRE_FUZZ_REPEAT: 20000

      # Name the aliases explicitly so this lane documents every suite which
      # needs generated C and cannot run in the ordinary build matrix.
      - name: Run the suites that need EverParse-generated C
        run: |
          opam exec -- dune build \
            @test/stubs/runtest @fuzz/diff/runtest @test/bench-diff/runtest \
            @test/bench/runtest
        env:
          BUILD_EVERPARSE: 1
