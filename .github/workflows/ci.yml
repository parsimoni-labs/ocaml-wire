name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['5.4', '5.3']
        include:
          - os: macos-latest
            ocaml-compiler: '5.4'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @install

      # Seed the property tests from the run id so each run explores a
      # different input set instead of replaying alcobar's constant seed.
      # Alcobar prints the counterexample on failure but not the seed, so a red
      # run is replayed with the one recorded here:
      #   WIRE_FUZZ_SEED=<run id> dune runtest
      # 20000 iterations rather than alcobar's 5000, because 5000 was not
      # enough to find the defects that are there.
      - run: opam exec -- dune runtest
        env:
          WIRE_FUZZ_SEED: ${{ github.run_id }}
          WIRE_FUZZ_REPEAT: 20000

  # The code wire.ocaml writes for OxCaml, its [@zero_alloc] checks
  # enforced, in the release profile and again in the paranoid one, where
  # every unchecked load it makes, the unboxed scanners' included, is checked
  # on its full index (make test-oxcaml).
  oxcaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: oxcaml-compiler.5.4.0-ox9
          opam-repositories: |
            ox: git+https://github.com/oxcaml/opam-repository.git#b66db7ae4ad21debd1b078635cc92e88d73610f8
            default: https://opam.ocaml.org

      - run: opam install . --deps-only --with-test

      - run: opam exec -- make test-oxcaml
        env:
          WIRE_FUZZ_SEED: ${{ github.run_id }}

  # The paranoid profile swaps the unchecked reads the fast paths make for
  # checked ones (lib/dune), so a read past the frame raises in the tests and
  # the fuzz properties instead of returning whatever the buffer holds next.
  paranoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune runtest --profile paranoid
        env:
          WIRE_FUZZ_SEED: ${{ github.run_id }}

  # The Rust Wire_rust generates, compiled without std and compared with the
  # codecs it comes from on the differential fuzzer's sample. Needs rustc only:
  # the generated code depends on nothing but core.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      # The runner image ships a stable Rust toolchain.
      - run: rustc --version

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build @test/rust/runtest @fuzz/diff/rust/runtest
        env:
          BUILD_RUST: 1
          WIRE_FUZZ_SEED: ${{ github.run_id }}

  # Hardcaml is an optional dependency: its lanes build only with
  # BUILD_HARDCAML=1, and the proofs need Yosys.
  hardcaml:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_HARDCAML: 1
      BUILD_EVERPARSE: 1
      WIRE_FUZZ_SEED: ${{ github.run_id }}
      WIRE_FUZZ_REPEAT: 1000
      WIRE_FUZZ_BUDGET: 0
      WIRE_DIFF_JOBS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'
      - run: opam install . --deps-only --with-test
      - run: opam install hardcaml.v0.17.1
      - run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"
      - name: Compare hardware with Codec, generated OCaml and EverParse C
        run: |
          opam exec -- dune build --profile release \
            @test/hardcaml/runtest @fuzz/diff/hardcaml/runtest \
            @fuzz/diff/hardcaml-stream/runtest
      - name: Prove mask equivalence and streaming control
        run: |
          mkdir -p _build/hardcaml-proofs
          for mode in proof proof-contiguous keep-proof; do
            opam exec -- dune exec --profile release bench/hardcaml-stream/gen.exe -- \
              "--$mode" "_build/hardcaml-proofs/$mode.v"
            hw_property=control
            if [ "$mode" = keep-proof ]; then hw_property=keep; fi
            HW_PROPERTY="$hw_property" \
              HW_MITER="$PWD/_build/hardcaml-proofs/$mode.v" \
              HW_OUT="$PWD/_build/hardcaml-proofs/$mode" \
              bench/hardcaml-stream/prove.sh
          done
      - name: Prove bounded padding and pipeline equivalence
        run: |
          opam exec -- dune exec --profile release bench/hardcaml/gen.exe -- \
            --padding _build/hardcaml-proofs/padding.v
          HW_MITER="$PWD/_build/hardcaml-proofs/padding.v" \
            HW_OUT="$PWD/_build/hardcaml-proofs/padding" \
            bench/hardcaml/prove-padding.sh
          opam exec -- dune exec --profile release bench/hardcaml/gen.exe -- \
            --pipeline-proof _build/hardcaml-proofs/pipeline.v
          HW_MITER="$PWD/_build/hardcaml-proofs/pipeline.v" \
            HW_OUT="$PWD/_build/hardcaml-proofs/pipeline" \
            bench/hardcaml/prove-pipeline.sh
      - name: Validate packaging and replay emitted RTL against EverParse C
        run: |
          sudo apt-get update && sudo apt-get install -y verilator
          verilator --version
          opam exec -- dune build --profile release @bench/hardcaml-cloud/runtest
          python3 -m pip wheel --no-deps --wheel-dir _build/hardcaml-wheels ./bench/hardcaml-cloud
          python3 -m venv _build/hardcaml-tools-env
          _build/hardcaml-tools-env/bin/python -m pip install --no-index \
            --find-links _build/hardcaml-wheels wire-hardcaml-tools
          mkdir -p _build/hardcaml-replay
          opam exec -- dune exec --profile release bench/hardcaml-stream/gen.exe -- \
            _build/hardcaml-replay/core.v _build/hardcaml-replay/core.json
          opam exec -- dune exec --profile release bench/hardcaml-stream/corpus.exe -- \
            --all _build/hardcaml-replay/frames.bin
          opam exec -- dune build --profile release bench/hardcaml-cloud/reference.exe
          oracle_entry=$(_build/hardcaml-tools-env/bin/wire-hardcaml-tools oracle-cache \
            _build/default/bench/hardcaml-cloud/reference.exe \
            _build/hardcaml-replay/frames.bin _build/hardcaml-replay/oracle-cache)
          _build/hardcaml-tools-env/bin/wire-hardcaml-tools bundle \
            _build/hardcaml-replay/core.json _build/hardcaml-replay/core.v _build/hardcaml-replay/component
          _build/hardcaml-tools-env/bin/wire-hardcaml-tools prepare ooc \
            _build/hardcaml-replay/component _build/hardcaml-replay/vivado-ooc
          _build/hardcaml-tools-env/bin/wire-hardcaml-tools rtl-test _build/hardcaml-replay/component \
            _build/hardcaml-replay/frames.bin "$oracle_entry/expected.jsonl" _build/hardcaml-replay/rtl \
            --oracle-receipt "$oracle_entry/receipt.json"
      - name: Retain RTL replay and captured records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardcaml-rtl-replay
          path: _build/hardcaml-replay
      - name: Retain hardware proof logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardcaml-proofs
          path: _build/hardcaml-proofs

  # OCaml's TSan runtime does not currently build on the macOS/arm64 runner
  # (runtime/weak.c), so keep this race-detection lane on Linux. The core test
  # suite includes a synchronized multi-domain decode of one shared codec.
  # Ubuntu 26.04 ships GCC 15, which cannot build the OCaml 5.4 runtime with
  # TSan, so this job stays on 24.04 until OCaml is fixed.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ThreadSanitizer link dependencies
        run: sudo apt-get update && sudo apt-get install -y libunwind-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 'ocaml-variants.5.4.1+options,ocaml-option-tsan'

      - run: opam install . --deps-only --with-test

      - name: Run core tests under ThreadSanitizer
        run: opam exec -- dune exec test/test.exe
        env:
          TSAN_OPTIONS: 'halt_on_error=1 history_size=7'

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install ocamlformat.0.29.0
      - run: opam exec -- dune fmt
      - run: git diff --exit-code

  merlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'
          dune-version: '3.21'

      - run: opam install . --deps-only --with-test
      - run: bash .github/scripts/install-merlint

      # merlint --build runs this itself but reports only the exit code, so
      # run it here first to get the compiler error on its own line.
      - run: opam exec -- dune build @check
      # merlint runs from the switch install-merlint builds it in, with the
      # project switch's dune and compiler.
      - run: opam exec -- "$(opam var --switch=merlint bin)/merlint" --build

  # Static analysis over the hand-written C. EverParse proves the parsers it
  # generates, but nothing covered the benchmark C written by hand around them,
  # in a project whose shipped deliverable is a C archive. The lane needs no
  # opam switch, so it costs a checkout and an apt install, and it is wired as
  # a normal blocking lane on that basis. cppcheck comes from the runner image,
  # so an image bump can bring a version with new checks; that shows up here as
  # a red lane on an unrelated pull request, and is fixed in the C or in the
  # suppression list, never by dropping the lane.
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y cppcheck

      # make cppcheck skips when the tool is absent, which would leave this
      # lane green having checked nothing. Fail here instead if apt did not
      # deliver it, and record the version the findings came from.
      - run: cppcheck --version

      - run: make cppcheck

  # One AFL job per fuzzer: fuzz/ fuzzes the [wire] library (round-trip and
  # validation) and fuzz/3d/ fuzzes [wire_3d] (the EverParse / 3D projection),
  # mirroring the lib/ layout. The [afl] profile (dune-workspace) instruments
  # native code with AFL coverage, and a dir's [fuzz] alias seeds its corpus and
  # runs afl-fuzz for a fixed wall-clock budget. The job names those two aliases
  # non-recursively, as fuzz/diff/ belongs to fuzz-afl-diff below. The job then
  # fails if afl-fuzz found any crashing input in either fuzzer, replaying each
  # one so the log names the codec and both answers. The afl profile also
  # checks every unchecked read (lib/dune).
  fuzz-afl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install afl-fuzz
        run: sudo apt-get update && sudo apt-get install -y afl++

      - name: Fuzz (seed corpus then afl-fuzz, via the fuzz aliases)
        run: |
          sudo sh -c 'echo core > /proc/sys/kernel/core_pattern'
          export AFL_SKIP_CPUFREQ=1 AFL_NO_AFFINITY=1
          opam exec -- dune build --profile afl @@fuzz/fuzz @@fuzz/3d/fuzz

      - name: Fail on crashes
        run: |
          fail=0
          for d in fuzz fuzz/3d; do
            out=_build/default/$d/_fuzz
            crashes=$(find "$out" -path '*/crashes/id:*' 2>/dev/null || true)
            if [ -n "$crashes" ]; then
              echo "::error::afl-fuzz found crashing inputs in $d/"
              for f in $crashes; do
                echo "--- replaying $f ---"
                _build/default/$d/fuzz.exe "$f" || true
              done
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then echo "No crashes found."; else exit 1; fi

      # afl's output filenames contain ':' (e.g. id:000000,...), which
      # upload-artifact rejects, so tar the findings first.
      - name: Package findings
        if: failure()
        run: tar czf afl-findings.tar.gz -C _build/default fuzz/_fuzz fuzz/3d/_fuzz || true

      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: afl-findings
          path: afl-findings.tar.gz

  # Differential fuzzer (fuzz/diff/, the wire_diff library): AFL feeds bytes to
  # both the OCaml codec and the EverParse-generated C parser and crashes on any
  # divergence. This is a separate job because it needs the EverParse toolchain
  # (to generate and compile the C parsers), which the wire / wire_3d fuzzers do
  # not, so installing it here keeps that job fast and its signal independent.
  fuzz-afl-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install afl-fuzz
        run: sudo apt-get update && sudo apt-get install -y afl++

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"

      - name: Fuzz diff (OCaml codec vs EverParse C)
        run: |
          sudo sh -c 'echo core > /proc/sys/kernel/core_pattern'
          export AFL_SKIP_CPUFREQ=1 AFL_NO_AFFINITY=1
          # Not fuzz/diff/rust, whose campaign needs rustc (BUILD_RUST=1).
          BUILD_EVERPARSE=1 opam exec -- dune build --profile afl \
            @@fuzz/diff/fuzz @@fuzz/diff/ocaml/fuzz @@fuzz/diff/ocaml-ox/fuzz

      - name: Fail on crashes
        run: |
          out=_build/default/fuzz/diff/_fuzz
          crashes=$(find "$out" -path '*/crashes/id:*' 2>/dev/null || true)
          if [ -n "$crashes" ]; then
            echo "::error::afl-fuzz found a differential divergence"
            for f in $crashes; do
              echo "--- replaying $f ---"
              _build/default/fuzz/diff/fuzz.exe "$f" || true
            done
            exit 1
          fi
          echo "No crashes found."

      - name: Package findings
        if: failure()
        run: tar czf afl-diff-findings.tar.gz -C _build/default/fuzz/diff _fuzz || true

      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: afl-diff-findings
          path: afl-diff-findings.tar.gz

  # Build the pure-OCaml core with wasm_of_ocaml and run test/wasm and the
  # fuzz smoke (fuzz/wasm) under node (31-bit ints, boxed-int32 optint
  # path). make test-wasm also fails
  # if wasm_of_ocaml truncates an out-of-range integer literal from wire's
  # code, which is how a 64-bit-only constant first surfaces downstream.
  # Meaningful only on a cold build, which CI always is.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      # wasm_of_ocaml shells out to binaryen (wasm-merge, wasm-opt) and needs
      # version 119 or newer; the Ubuntu package is too old.
      - name: Install binaryen
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$BINARYEN_LINUX_X86_64_URL" \
            "$BINARYEN_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - run: opam install wasm_of_ocaml-compiler

      - name: Run the wasm tests under node
        run: opam exec -- make test-wasm

  # Run the test suite with the EverParse toolchain installed so the 3d.exe
  # projection checks actually execute: test/3d compiles and runs the generated
  # C end to end, and fuzz/3d runs every covered schema through 3d.exe. Without
  # 3d.exe both are skipped, so a shape that builds but does not project to a
  # validator EverParse verifies (a composite-over-composite gap) would slip
  # past the plain build job, which only string-checks the projection.
  #
  # The job also runs the suites gated on BUILD_EVERPARSE=1, which nothing else
  # reaches: fuzz-afl-diff sets the variable but builds only the fuzz/diff
  # campaigns under --profile afl, and those rules require a non-afl profile.
  everparse-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"

      - name: Run tests with 3d.exe projection checks
        run: opam exec -- dune runtest
        env:
          WIRE_3D_BATCH: 1
          WIRE_FUZZ_SEED: ${{ github.run_id }}
          WIRE_FUZZ_REPEAT: 20000

      # Name the aliases explicitly so this lane documents every suite which
      # needs generated C and cannot run in the ordinary build matrix.
      - name: Run the suites that need EverParse-generated C
        run: |
          opam exec -- dune build \
            @test/stubs/runtest @fuzz/diff/runtest @test/bench-diff/runtest \
            @test/bench/runtest @test/ocaml/runtest @fuzz/diff/ocaml/runtest
        env:
          BUILD_EVERPARSE: 1

  # make prove: F* proves the scanners of the codecs proofs/fstar-gen/dune
  # lists equal to the parser 3d.exe writes for each, and refuses the mutant
  # there, with the F* and Z3 EverParse ships. The checked modules are cached
  # on the EverParse release, the F* library and the generator; F* checks
  # again any module whose source or dependencies changed, and make prove
  # removes every entry the run did not use, so the cache saved is only
  # what this tree needs. WIRE_FSTAR_CACHE names the directory the cache
  # step saves, instead of the default in _build.
  #
  # The job then checks the model of the planner in proofs/fstar with the
  # same F*: its theorems (verify), the checker plans.exe runs against the
  # extraction of the model (check-extract), every decision the emitter
  # reports for the sampled codecs against the model (plans) and every past
  # defect and mutant refused (defects). plans.exe links the fuzzers'
  # codecs, hence --with-test. From a cold F* cache, on one loaded host:
  # verify 100 s of CPU, check-extract 1 s, plans 6 s once plans.exe is
  # built (23 s), defects 9 to 14 min of CPU, 6 to 7 min with -j4.
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      - run: opam install . --deps-only --with-test

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/wire-fstar
          key: fstar-${{ hashFiles('.github/ci-dependencies.env', 'proofs/fstar-gen/**', 'proofs/fstar/Plan.Word.fst', 'scripts/fstar-gen/**', 'bench/rust/headers.ml', 'lib/**', 'examples/**') }}
          restore-keys: |
            fstar-

      - name: Prove the scanners against 3d.exe
        run: WIRE_FSTAR_CACHE=$HOME/.cache/wire-fstar opam exec -- make prove

      - name: Check the planner model
        run: opam exec -- make -C proofs/fstar verify check-extract

      - name: Refuse the past defects and the mutants of the model
        run: opam exec -- make -C proofs/fstar -j4 defects

      - name: Check the emitter's decisions against the model
        run: opam exec -- make -C proofs/fstar plans

  # verify/ executes the generated scanners and record modules symbolically
  # and has Z3, the one EverParse ships, prove their reads in bounds and
  # their answers equal to those of 3d.exe's specification, refuse the
  # defects planted in mutants (stride_threshold_ox among them, the
  # positive control of the OxCaml frame loop) and classify every check of
  # the scanners as needed for safety or for semantics. These rules took
  # 2.7 hours of CPU, and 88 minutes two at a time on an 18-core machine
  # under a load of 100 to 200, against 3 to 7 minutes for prove here; the
  # job runs beside everparse-3d, which takes 80 to 130 minutes, so it
  # should not lengthen the run. The OxCaml frame loop's bounds
  # (@verify/bounds-ox, in make verify) took 1.7 hours of CPU more and are
  # not run here. One rule at a time: each runs four Z3 processes, one per
  # core of the runner.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam install . --deps-only

      - name: Install EverParse
        run: |
          source .github/ci-dependencies.env
          bash .github/scripts/install-archive \
            "$EVERPARSE_LINUX_X86_64_URL" \
            "$EVERPARSE_LINUX_X86_64_SHA256" \
            "$HOME/.local"
          echo "$HOME/.local/everparse/bin" >> "$GITHUB_PATH"
          z3=$(sed -n 's/^EVERPARSE_Z3_VERSION ?= //p' \
            "$HOME/.local/everparse/lib/everparse/z3-version.Makefile")
          z3=$HOME/.local/everparse/lib/fstar/z3-$z3/bin
          test -x "$z3/z3"
          echo "$z3" >> "$GITHUB_PATH"

      # The rules are skipped, and the lane green, when z3 is not in PATH.
      - run: z3 --version

      - name: Verify the generated code against 3d.exe
        run: opam exec -- dune build -j 1 @verify/runtest @verify/classify
        env:
          BUILD_EVERPARSE: 1
