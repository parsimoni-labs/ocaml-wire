[metadata]
name = wire-hardcaml-tools
version = 0.1.0.dev0
description = Portable staging, replay and timing tools for Wire hardware experiments
long_description = file: README.md
long_description_content_type = text/markdown
license = ISC
license_files = LICENSE

[options]
packages = wire_hardcaml_tools
python_requires = >=3.9

[options.package_data]
wire_hardcaml_tools = *.tcl

[options.entry_points]
console_scripts =
    wire-hardcaml-tools = wire_hardcaml_tools.__main__:main
